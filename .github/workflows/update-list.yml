name: Update filtered list

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-list.yml'
      - 'allowlist.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Top 1000 list
        shell: python
        run: |
          import re
          import urllib.request
          from datetime import date

          source = 'https://raw.githubusercontent.com/Zalexanninev15/NoADS_RU/main/ads_list.txt'
          text = urllib.request.urlopen(source, timeout=60).read().decode('utf-8', errors='replace')

          domain_rule = re.compile(r'^\|\|[A-Za-z0-9._-]+\^$')
          priority = (
              'ad', 'ads', 'advert', 'analytics', 'metric', 'track', 'tracker',
              'tracking', 'counter', 'pixel', 'telemetry', 'beacon', 'stat',
              'doubleclick', 'googlesyndication', 'googleadservices', 'adservice',
              'webvisor', 'metrika', 'clarity', 'mathtag', 'yield', 'rtb'
          )

          seen = set()
          preferred = []
          fallback = []

          for raw in text.splitlines():
              rule = raw.strip()
              if not domain_rule.fullmatch(rule) or rule in seen:
                  continue
              seen.add(rule)
              domain = rule[2:-1].lower()
              if any(word in domain for word in priority):
                  preferred.append(rule)
              else:
                  fallback.append(rule)

          # The account allows 1000 rules in total and this list is all of them,
          # so exceptions have to come out of the same budget: each allowlisted
          # domain costs one ad rule. AdGuard honours an @@ exception from any
          # enabled list over blocks in the others.
          allowed = []
          for raw in open('allowlist.txt', encoding='utf-8'):
              domain = raw.split('#', 1)[0].strip().lower()
              if domain and domain not in allowed:
                  if not re.fullmatch(r'[a-z0-9.-]+\.[a-z]{2,}', domain):
                      raise RuntimeError(f'Not a domain in allowlist.txt: {domain!r}')
                  allowed.append(domain)

          def covered(rule):
              domain = rule[2:-1].lower()
              return any(domain == a or domain.endswith('.' + a) for a in allowed)

          # NoADS_RU turned into a browser filter on 2026-09-16: most of it is
          # now cosmetic rules, image paths and $modifiers, and only about two
          # hundred lines are still plain domain rules a DNS server can use.
          # Rebuilding from that would swap out a large part of a list that
          # works, so the rules already here come first and the source only
          # fills the slots they leave free. The list never shrinks, and
          # adding an exception displaces exactly one rule.
          previous = []
          try:
              for raw in open('ads_list.txt', encoding='utf-8'):
                  rule = raw.strip()
                  if domain_rule.fullmatch(rule) and rule not in previous:
                      previous.append(rule)
          except FileNotFoundError:
              pass

          exceptions = [f'@@||{domain}^' for domain in allowed]
          fresh = [r for r in preferred + fallback if r not in previous]
          blocks = [r for r in previous + fresh if not covered(r)]
          rules = exceptions + blocks[:1000 - len(exceptions)]
          if len(rules) != 1000:
              raise RuntimeError(f'Expected 1000 rules, got {len(rules)}')

          header = [
              '! Title: NoADS_RU Top 1000',
              f'! Source: {source}',
              f'! Generated: {date.today().isoformat()}',
              '! Rules: 1000',
              f'! Exceptions: {len(exceptions)} (from allowlist.txt)',
              '! Selection: universal advertising and tracking domain rules',
              '! This is a curated subset, not an official edition of NoADS_RU',
              '',
          ]
          with open('ads_list.txt', 'w', encoding='utf-8', newline='\n') as f:
              f.write('\n'.join(header + rules) + '\n')

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ads_list.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update top 1000 ad rules'
          git push
